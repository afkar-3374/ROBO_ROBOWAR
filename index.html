<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Voice Car Control</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
padding-top:40px;
}

button{
width:220px;
height:70px;
font-size:20px;
border:none;
border-radius:12px;
margin:15px;
cursor:pointer;
}

.start{
background:#22c55e;
}

.stop{
background:#ef4444;
}

#status{
margin-top:30px;
background:#1e293b;
padding:20px;
border-radius:10px;
width:80%;
margin:auto;
font-size:18px;
}

</style>
</head>

<body>

<h1>🚗 Voice Controlled Car</h1>

<button class="start" onclick="startListening()">🎤 Start Command</button>
<button class="stop" onclick="stopListening()">🛑 Stop Command</button>

<div id="status">Press START to give command</div>

<script>

/* MQTT CONNECTION */

const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

client.on("connect",function(){
console.log("MQTT Connected");
});

/* SEND MQTT */

function sendCommand(cmd){

console.log("Sending:",cmd);

client.publish("car/control",cmd);

}

/* VOICE RECOGNITION */

const SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition;

const recognition = new SpeechRecognition();

recognition.lang="en-US";
recognition.continuous=true;
recognition.interimResults=false;

/* START LISTENING */

function startListening(){

document.getElementById("status").innerText="🎤 Listening started...";

recognition.start();

}

/* STOP LISTENING */

function stopListening(){

recognition.stop();

sendCommand("stop");

document.getElementById("status").innerText="🛑 Listening stopped";

}

/* EVENTS */

recognition.onstart=function(){

document.getElementById("status").innerText="🎤 Listening... Speak command";

};

recognition.onspeechstart=function(){

document.getElementById("status").innerText="🗣 Speech detected";

};

recognition.onresult=function(event){

let text=event.results[event.results.length-1][0].transcript.toLowerCase();

document.getElementById("status").innerText="✅ Heard: "+text;

processCommand(text);

};

recognition.onerror=function(event){

document.getElementById("status").innerText="❌ Error: "+event.error;

};

/* COMMAND PROCESSING */

function processCommand(cmd){

if(cmd.includes("forward")){

sendCommand("forward");

}

else if(cmd.includes("back")){

sendCommand("backward");

}

else if(cmd.includes("left")){

sendCommand("left");

}

else if(cmd.includes("right")){

sendCommand("right");

}

else if(cmd.includes("stop")){

sendCommand("stop");

}

else if(cmd.includes("dance")){

startDance();

}

}

/* DANCE MODE */

function startDance(){

document.getElementById("status").innerText="💃 Dance mode";

const moves=["forward","backward","left","right"];

let dance=setInterval(()=>{

let move=moves[Math.floor(Math.random()*moves.length)];

sendCommand(move);

},700);

setTimeout(()=>{

clearInterval(dance);

sendCommand("stop");

document.getElementById("status").innerText="💃 Dance finished";

},8000);

}

</script>

</body>
</html>
